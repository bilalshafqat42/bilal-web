# Repository checks.
#
# Created alongside the h1 check, because there was no CI at all — the missing
# h1 on /process reached a review only because someone happened to run a sweep
# by hand. A check nobody runs is not a check.
#
# The h1, schema and search checks need a running server, so the job builds, starts the
# production server, waits for it, then runs them against it.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: Node 20 reaches end of life in April 2026, and Next 16
          # requires 20.9 or later, so the floor would arrive with no warning.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      # Runs before the build: a discipline that gained work without gaining a
      # route is a missing page, and there is no reason to spend a build finding
      # that out.
      - name: Discipline routes match the data
        run: npm run discipline-check

      # The recovered articles: no orphans, related reading on topic, stored
      # word counts matching the prose, no empty headings. Reads the data only,
      # so it runs before the build too.
      - name: Article data integrity
        run: npm run related-check

      # Every option a lead form renders must be accepted by /api/lead's
      # allow-lists. Three /contact choices were silently refused until
      # 2026-10-14. Data only, so before the build.
      - name: Lead form options accepted by the route
        run: npm run lead-options-check

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npx next start -p 3000 &
          # Poll rather than sleep a fixed time: a cold start on a CI runner is
          # slower and less predictable than on a laptop.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "Server did not start within 60s"
          exit 1

      - name: Every route has exactly one non-empty h1
        run: npm run h1-check
        env:
          BASE_URL: http://localhost:3000

      - name: JSON-LD types, validity and banned markup
        run: npm run schema-check
        env:
          BASE_URL: http://localhost:3000

      - name: Search ranking regression check
        run: npm run search-check
