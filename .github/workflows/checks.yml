# Repository checks.
#
# Created alongside the h1 check, because there was no CI at all — the missing
# h1 on /process reached a review only because someone happened to run a sweep
# by hand. A check nobody runs is not a check.
#
# Data-only checks (lint, types, discipline routes, article data, lead
# options, image variants, search ranking, the scorer self-test) run before
# the build. The h1 and schema checks need a running server, so the job builds,
# starts the production server, waits for it, then runs them against it. The
# lead probe starts its own server from the same build.
#
# Actions are pinned to version tags, not commit SHAs. Pinning to a SHA needs
# the tag resolved against GitHub, which was not done offline in audit batch 3
# (2026-10-24). To do it: `git ls-remote https://github.com/actions/checkout
# refs/tags/v7` and likewise for setup-node, then `uses: owner/repo@<sha> # v7`.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Read the code, nothing else. The job never writes to the repository, issues
# or releases, so the token gets no write scope at all.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes. A hung server or fetch should fail the
    # run, not hold a runner for GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      # v7 (7.0.1, July 2026). v4 ran on Node 20, which GitHub deprecated for
      # actions, so every run logged a warning. Majors chosen once they were at
      # least two weeks old.
      - uses: actions/checkout@v7
        with:
          # No token left in .git/config for later steps to pick up.
          persist-credentials: false

      # Pinned to v7.0.0 (July 2026) rather than the floating @v7 tag, which
      # already points at 7.1.0 (2026-10-08) and was under two weeks old when
      # this was updated. Move to @v7 once 7.1 has settled.
      - uses: actions/setup-node@v7.0.0
        with:
          # 22, not 20: Node 20 reaches end of life in April 2026, and Next 16
          # requires 20.9 or later, so the floor would arrive with no warning.
          node-version: 22
          cache: npm

      - run: npm ci

      # Known high or critical advisories in what the site ships (dev tools
      # excluded, they never reach the server).
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      # Runs before the build: a discipline that gained work without gaining a
      # route is a missing page, and there is no reason to spend a build finding
      # that out.
      - name: Discipline routes match the data
        run: npm run discipline-check

      # The recovered articles: no orphans, related reading on topic, stored
      # word counts matching the prose, no empty headings. Reads the data only,
      # so it runs before the build too.
      - name: Article data integrity
        run: npm run related-check

      # Every option a lead form renders must be accepted by /api/lead's
      # allow-lists. Three /contact choices were silently refused until
      # 2026-10-14. Data only, so before the build.
      - name: Lead form options accepted by the route
        run: npm run lead-options-check

      # Every image under public/portfolio, images and blog has its pre-cut
      # AVIF widths, cut from its current contents, and nothing else is left
      # over. The image loader points srcsets at these files, so a missing one
      # is a broken image on the live site (roadmap 419). Data only.
      - name: Image variants present and current
        run: npm run image-check

      # Imports the real index from src/lib and ranks fixtures against it. No
      # server needed, so it runs before the build (it used to run after it).
      - name: Search ranking regression check
        run: npm run search-check

      # The on-page scorer's matching rules: entities, word boundaries,
      # optional stop words, counting inside <main> only. Every score in
      # onpage, daily and audit depends on them.
      - name: Scorer self-test
        run: npm run score-selftest

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npx next start -p 3000 &
          # Poll rather than sleep a fixed time: a cold start on a CI runner is
          # slower and less predictable than on a laptop.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "Server did not start within 60s"
          exit 1

      - name: Every route has exactly one non-empty h1
        run: npm run h1-check
        env:
          BASE_URL: http://localhost:3000

      - name: JSON-LD types, validity and banned markup
        run: npm run schema-check
        env:
          BASE_URL: http://localhost:3000

      # /api/lead's guards (size limit, validation, origin check, rate limit,
      # header injection). Safe here: the script starts its own server on port
      # 3099 from the build above, with CRM_LEAD_API_URL pointed at a closed
      # port, SMTP blank and the lead backup in a temp folder, and refuses to
      # run unless the CRM address is proved unreachable first. Every probe uses
      # an @example.invalid address. It also refuses a build older than src/.
      - name: Lead endpoint guards
        run: npm run lead-probe
