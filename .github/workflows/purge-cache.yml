name: Purge Cloudflare after deploy

# Hostinger rebuilds the site on every push to main and deletes the previous
# build's /_next/static files. Cloudflare can keep serving HTML from the old
# build (s-maxage plus stale-while-revalidate), which then asks for scripts
# that no longer exist: the page renders but nothing on it responds. Seen on
# 2026-10-14 (roadmap 401). This job waits until the origin serves the new
# build (read from /version.txt, see src/app/version.txt/route.ts), then
# purges Cloudflare so every visitor gets matching HTML and JS.
#
# Needs two repository secrets (Settings, Secrets and variables, Actions):
#   CLOUDFLARE_API_TOKEN  a token with only Zone > Cache Purge > Purge, for
#                         bilalshafqat.com
#   CLOUDFLARE_ZONE_ID    the Zone ID from the domain's Overview page
# Without them the job logs a warning (visible on the run summary, so a skipped
# purge is not missed) and exits successfully.

on:
  push:
    branches: [main]
    # Notes-only pushes rebuild to identical chunk files, so old HTML still
    # works; no purge needed, and no Actions minutes spent waiting.
    paths-ignore:
      - "roadmap.md"
      - "backlink-plan.md"
      - "SEO-SNAPSHOT.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: purge-cache
  cancel-in-progress: true

# The job only calls the site and the Cloudflare API with curl. It never
# checks out or writes to the repository, so the GitHub token gets read-only
# access (audit batch 3). timeout-minutes is set on the job below.
permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for the new build, then purge
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SITE: https://bilalshafqat.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "::warning::Cloudflare secrets not set; skipping purge. Purge Cloudflare by hand after this deploy."
            exit 0
          fi

          # /version.txt (src/app/version.txt/route.ts) is written at build
          # time and says which build is live:
          #   sha=<commit the build was made from, or "unknown">
          #   build=<random id, new on every build>
          # A unique query string bypasses the Cloudflare cache, so this reads
          # the origin. A failed or empty fetch prints nothing, and nothing is
          # never read as "new build" (audit batch 1, 2026-10-24: the old
          # fingerprint check could mistake a failed fetch for a new build and
          # purge before the deploy finished).
          live_version() {
            curl -fsS --max-time 15 "$SITE/version.txt?purge-check=$(date +%s%N)" 2>/dev/null || true
          }
          field() {
            printf '%s\n' "$1" | sed -n "s/^$2=//p" | head -n 1
          }

          start=$(live_version)
          before_sha=$(field "$start" sha)
          before_build=$(field "$start" build)
          echo "Expecting commit $EXPECTED_SHA."
          echo "At start: sha=${before_sha:-none} build=${before_build:-none}"

          live=no
          if [ "$before_sha" = "$EXPECTED_SHA" ]; then
            live=yes
            echo "Commit already live."
          else
            # Hostinger usually finishes in about 2 minutes. Poll for up to 8.
            for i in $(seq 1 24); do
              sleep 20
              now=$(live_version)
              now_sha=$(field "$now" sha)
              now_build=$(field "$now" build)
              if [ -z "$now_build" ]; then
                echo "~$((i * 20))s: no answer from the origin; still waiting."
                continue
              fi
              # Best signal: the build says it is the commit just pushed.
              if [ "$now_sha" = "$EXPECTED_SHA" ]; then
                live=yes
                echo "Commit $EXPECTED_SHA live after ~$((i * 20))s."
                break
              fi
              # Fallback when the host's build cannot see the commit: a
              # different build id than the one read at the start. Only when
              # the start read worked, so a failed first fetch cannot make the
              # old build look new.
              if [ "$now_sha" = "unknown" ] && [ -n "$before_build" ] && [ "$now_build" != "$before_build" ]; then
                live=yes
                echo "New build live after ~$((i * 20))s (build $now_build; commit not exposed by the host)."
                break
              fi
              echo "~$((i * 20))s: still sha=${now_sha:-none}; waiting."
            done
          fi

          if [ "$live" != yes ]; then
            # Purging is harmless, so do it rather than guess; the warning
            # shows on the run summary so a slow or failed deploy is noticed.
            echo "::warning::New build not confirmed after 8 minutes; purging anyway. Check the deploy, then purge again by hand if it finished later."
          fi

          response=$(curl -fsS --max-time 30 -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true)
          if printf '%s' "$response" | grep -q '"success":true'; then
            echo "Cloudflare cache purged."
          else
            echo "::error::Cloudflare purge failed."
            exit 1
          fi
