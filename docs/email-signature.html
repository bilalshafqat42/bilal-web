  Paste the block below into Titan: Settings → Signatures → the HTML button in
  the toolbar. Paste it there, not into the visual editor, or the markup is

  WHY IT LOOKS LIKE 2004 HTML. Email clients are not browsers. Outlook renders
  with Microsoft Word's engine, Gmail strips <style> blocks, and neither
  supports flexbox or grid. Tables with inline styles are the only layout that
  survives all of them. This is not old-fashioned markup; it is the only
  markup that works.

  THE PHOTO is Bilal's GitHub avatar, served at 128px by GitHub's own `&s=`
  parameter rather than resized with CSS.

  That choice is the difference between 3.4KB and 19KB. The original is
  434x434; `&s=128` returns a real 128px file, and the width/height attributes
  display it at 64. CSS alone would download the full 434px image and shrink it
  in the client, which wastes the bytes and, in Outlook, often ignores the CSS
  and renders it at full size anyway.

  128 rather than 64 because it displays at 64: a retina screen needs two
  device pixels per CSS pixel or the face looks soft.

  Width and height are set as HTML *attributes*, not only in the style. Outlook
  renders with Word's engine and reads the attributes; a style-only size is
  ignored there.

  The trade: the image lives on GitHub's CDN, so changing the GitHub avatar
  changes every signature already sent. Acceptable — it is the same face, and
  the alternative is remembering to update a file on the site.

  Many clients block remote images by default, so everything still reads with
  the photo missing. That is why the gold rule and the type do the work.

  WHAT IS DELIBERATELY ABSENT:
    - social icon rows. Eight coloured squares read as a newsletter footer
    - a logo image as well as a photo. One image is a signature, two is a banner
    - "Sent from my iPhone", quotes, legal disclaimers, "please consider the
      environment". Nobody reads them and they make a short reply look long
-->
